# Local development setup: `docker compose up` starts the database, backend and frontend.
# Passwords below are for local development only. Ports are only reachable from this computer.
name: mdm-case-study

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: workwize
      MYSQL_USER: workwize
      MYSQL_PASSWORD: workwize_local_only
      MYSQL_ROOT_PASSWORD: root_local_only
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/create-test-database.sql:/docker-entrypoint-initdb.d/create-test-database.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "workwize", "-pworkwize_local_only"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build: ./backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: workwize
      DB_USERNAME: workwize
      DB_PASSWORD: workwize_local_only
      # The Jamf mock file. Can be pointed at a scenario file for manual checks
      # (see backend/tests/Fixtures/jamf/README.md); defaults to the real mock.
      MDM_JAMF_MOCK_PATH: ${MDM_JAMF_MOCK_PATH:-/var/www/files/api-mock-response.json}
      # Handle several requests at once (needed to test "sync already running").
      PHP_CLI_SERVER_WORKERS: 4
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/var/www/backend
      - backend-vendor:/var/www/backend/vendor
      # The Jamf mock data, read-only so the backend can never change it.
      - ./files:/var/www/files:ro
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules

volumes:
  mysql-data:
  backend-vendor:
  frontend-node-modules:
